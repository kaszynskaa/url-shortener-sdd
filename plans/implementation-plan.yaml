      - "reviews/initial-code-review.json — code-reviewer.yaml output (pre-fix)"
      - "reviews/post-fix-review.json — clean review after fixes applied"
    team_hint: Backend engineer 2
    exit_criteria: "schema_runner.py runs without error; validated_output.json passes jsonschema validation"
    estimated_days: 1
    spec_refs: [NFR-003, NFR-005, AC-004]

# =============================================================================
# RISK REGISTER
# =============================================================================

risk_register:

  - risk: "Short-code collision under high write volume"
    likelihood: M
    impact: H
    mitigation: >
      Use 8-char NanoID (62^8 ≈ 218 trillion combos). Add DB UNIQUE constraint
      with retry loop (max 3 attempts) on INSERT conflict before surfacing error.

  - risk: "Redis unavailability blocks redirect hot path"
    likelihood: L
    impact: H
    mitigation: >
      Treat Redis as a best-effort cache. On connection error, fall through to
      DB read. Log cache miss spike as alert. Never raise 5xx because Redis is down.

  - risk: "SSRF bypass via DNS rebinding or redirect chains"
    likelihood: M
    impact: H
    mitigation: >
      Block private-range IPs at URL submission time (not at redirect time).
      Do not follow redirects during validation. Document as known limitation
      and add to NFR-003 open questions.

  - risk: "GDPR non-compliance if raw IPs leak into logs"
    likelihood: M
    impact: H
    mitigation: >
      Hash IPs in analytics_service before any DB write. Add test AC-009
      that asserts no raw IPs appear in CLICKS table. Exclude raw IPs from
      structured logs via log filter.

  - risk: "p99 redirect latency exceeds 50 ms under 10 k RPS"
    likelihood: M
    impact: M
    mitigation: >
      Cache warm-up on URL creation (write-through). Monitor cache-hit rate;
      alert at < 90%. Add hiredis C extension for 3× Redis client throughput.
      Load test with k6 before GA.

# =============================================================================
# ARCHITECTURE DECISION RECORDS
# =============================================================================

adrs:

  - title: "ADR-01: 302 over 301 for redirects"
    status: accepted
    context: >
      301 (Permanent Redirect) is cached by browsers, eliminating repeat server
      hits and improving latency. However, it prevents click analytics from working
      after the first visit and makes URL updates invisible to cached browsers.
    decision: >
      Use 302 (Found / Temporary Redirect). Every redirect hits the service,
      enabling analytics and allowing long-URL updates. Cache-Control: no-store
      prevents browser caching.
    consequences: >
      Higher server load per unique visitor. Mitigated by Redis cache-aside
      (DB not hit on cache-resident codes). Open question SC-002 to revisit
      if analytics requirement is dropped.

  - title: "ADR-02: Soft delete over hard delete"
    status: accepted
    context: >
      FR-005 requires DELETE to make GET /{shortCode} return 404. Options:
      (a) hard-delete the row, (b) set deleted_at timestamp.
    decision: >
      Soft delete (set deleted_at). Row retained for audit log integrity,
      analytics history, and the 30-day short-code reuse freeze (state diagram).
    consequences: >
      Need to filter deleted_at IS NULL in all active-URL queries.
      Scheduled purge job required after 90-day retention window.

  - title: "ADR-03: In-process async background tasks for click recording"
    status: accepted
    context: >
      Click recording must not block the redirect response (NFR-001: p99 ≤ 50 ms).
      Options: (a) FastAPI BackgroundTasks, (b) message queue (Kafka/SQS),
      (c) fire-and-forget asyncio task.
    decision: >
      FastAPI BackgroundTasks for v1. Zero additional infrastructure.
      Acceptable data-loss risk (worker crash loses in-flight events)
      is acceptable at current scale.
    consequences: >
      Some click events may be lost on process restart. Acceptable for v1.
      Migrate to Kafka if loss rate > 0.1% or volume > 1 M clicks/day.

  - title: "ADR-04: NanoID 8-char for short code generation"
    status: accepted
    context: >
      Need short, URL-safe, collision-resistant codes. Options:
      (a) Sequential integer (predictable, IDOR risk), (b) UUID (too long),
      (c) NanoID/custom random (configurable length).
    decision: >
      Custom 8-char generator using secrets.choice over 62-char alphabet
      (a-z A-Z 0-9). 62^8 ≈ 218 T combinations. Retry on DB unique constraint
      violation (expected frequency < 1 in 10^9 at 1 M URLs).
    consequences: >
      No sequential guessing (A01 IDOR mitigation). Short enough for
      sharing. Length configurable via SHORT_CODE_LENGTH env var.

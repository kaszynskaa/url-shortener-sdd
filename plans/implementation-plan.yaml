# =============================================================================
# ARCHITECTURE STYLE
# =============================================================================

architecture_style:
  name: Layered Monolith with Cache-Aside
  justification: >
    Team size (3 BE + 1 FE) and P1 priority favour a single deployable unit
    over microservices operational overhead. Redis cache-aside pattern satisfies
    NFR-001 (p99 ≤ 50 ms redirect) without distributed-tracing complexity.
    Clean layer boundaries (routers → services → data) allow extraction to
    microservices if traffic warrants it post-launch.
  diagram_description: >
    Client → CDN/Edge → FastAPI App (Auth MW → Rate-Limit MW → Routers →
    Services) → Redis Cache (hot-path reads) + PostgreSQL (source of truth).
    Analytics writes go through an async task queue (background tasks) so they
    never block the redirect response.

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  - id: COMP-01
    name: FastAPI Application
    responsibility: >
      Hosts all HTTP endpoints, wires middleware (auth, rate-limit),
      manages startup/shutdown lifecycle (DB pool, Redis connection).
    technology: "Python 3.12, FastAPI 0.115, Uvicorn"
    deployment_unit: Docker container (single replica in v1, HPA in v2)
    depends_on: [COMP-02, COMP-03]

  - id: COMP-02
    name: PostgreSQL Database
    responsibility: >
      Source of truth for URLS, CLICKS, USERS, AUDIT_LOG,
      RATE_LIMIT_WINDOWS. Handles soft-delete, expiry timestamps.
    technology: "PostgreSQL 16, SQLAlchemy 2.0 (async), asyncpg"
    deployment_unit: Managed RDS / Cloud SQL instance
    depends_on: []

  - id: COMP-03
    name: Redis Cache
    responsibility: >
      Cache-aside for the redirect hot path (GET /{shortCode}).
      Also stores sliding-window rate-limit counters (FR-004).
      Target cache-hit rate ≥ 95% (NFR-006).
    technology: "Redis 7, redis-py asyncio client"
    deployment_unit: Managed Elasticache / Cloud Memorystore
    depends_on: []

  - id: COMP-04
    name: URL Validator
    responsibility: >
      Stateless service that validates scheme (http/https) and blocks
      SSRF targets (RFC 1918, link-local, loopback). REQ: FR-003, NFR-003.
    technology: Python stdlib (ipaddress, urllib.parse)
    deployment_unit: In-process module (COMP-01)
    depends_on: []

  - id: COMP-05
    name: Rate Limiter Middleware
    responsibility: >
      Sliding-window rate limiter backed by Redis. 100 req/min per API key.
      Returns 429 + Retry-After on breach. REQ: FR-004, NFR-004.
    technology: FastAPI Middleware, Redis INCR + EXPIRE
    deployment_unit: In-process module (COMP-01)
    depends_on: [COMP-03]

  - id: COMP-06
    name: Analytics Worker
    responsibility: >
      Async background task that records each redirect click: hashes IP
      (SHA-256 + salt), resolves country code, writes CLICKS row.
      REQ: FR-008, NFR-005.
    technology: FastAPI BackgroundTasks, Python hashlib
    deployment_unit: In-process background task (COMP-01)
    depends_on: [COMP-02]

  - id: COMP-07
    name: Schema Runner
    responsibility: >
      Demonstrates schema-enforced Claude API interaction. Calls Anthropic
      SDK with inline JSON schema via tool_use, validates response, saves
      output. REQ: Part 3.3.
    technology: "Python, anthropic SDK, jsonschema"
    deployment_unit: Standalone CLI script (schema_runner/)
    depends_on: []

# =============================================================================
# INTERFACES
# =============================================================================

interfaces:

  - id: IF-01
    from_component: COMP-01
    to_component: COMP-02
    protocol: SQL over TCP (asyncpg)
    schema_summary:
      request: "SQLAlchemy Core / ORM queries (parameterised)"
      response: "Row objects / scalar results"
    sla:
      max_latency_ms: 50
      error_budget_percent: 0.1

  - id: IF-02
    from_component: COMP-01
    to_component: COMP-03
    protocol: Redis RESP3 (hiredis)
    schema_summary:
      get: "GET <shortCode> → longUrl string | nil"
      set: "SET <shortCode> <longUrl> EX <ttl>"
      del: "DEL <shortCode>"
      incr: "INCR <bucket_key>; EXPIRE <bucket_key> 60"
    sla:
      max_latency_ms: 5
      error_budget_percent: 0.01

  - id: IF-03
    from_component: Client
    to_component: COMP-01
    protocol: HTTPS REST (JSON)
    schema_summary:
      create: "POST /api/v1/urls → 201 UrlResponse"
      redirect: "GET /{shortCode} → 302 Location header"
      get: "GET /api/v1/urls/{shortCode} → 200 UrlResponse"
      delete: "DELETE /api/v1/urls/{shortCode} → 204"
      stats: "GET /api/v1/urls/{shortCode}/stats → 200 StatsResponse"
    sla:
      max_latency_ms: 50
      error_budget_percent: 0.1

# =============================================================================
# DATA MODELS  (summary — full schema in specs/diagrams/er-data-model.md)
# =============================================================================

data_models:

  - name: urls
    store_type: relational
    fields:
      - { name: id,            type: uuid,         constraints: [PK, DEFAULT gen_random_uuid()] }
      - { name: user_id,       type: uuid,         constraints: [FK→users.id, NOT NULL] }
      - { name: long_url,      type: text,         constraints: [NOT NULL, CHECK length ≤ 2048] }
      - { name: short_code,    type: varchar(32),  constraints: [UNIQUE, NOT NULL] }
      - { name: custom_alias,  type: varchar(32),  constraints: [NULLABLE] }
      - { name: is_active,     type: boolean,      constraints: [DEFAULT true, NOT NULL] }
      - { name: expires_at,    type: timestamptz,  constraints: [NULLABLE] }
      - { name: created_at,    type: timestamptz,  constraints: [DEFAULT now(), NOT NULL] }
      - { name: updated_at,    type: timestamptz,  constraints: [DEFAULT now(), NOT NULL] }
      - { name: deleted_at,    type: timestamptz,  constraints: [NULLABLE] }
    indexes:
      - { name: idx_urls_short_code,       fields: [short_code],              type: btree }
      - { name: idx_urls_user_id_created,  fields: [user_id, created_at],     type: btree }
      - { name: idx_urls_expires_active,   fields: [expires_at, is_active],   type: partial }

  - name: clicks
    store_type: relational
    fields:
      - { name: id,           type: uuid,        constraints: [PK] }
      - { name: url_id,       type: uuid,        constraints: [FK→urls.id, NOT NULL] }
      - { name: ip_hash,      type: varchar(64), constraints: [NOT NULL] }
      - { name: user_agent,   type: varchar(512),constraints: [NULLABLE] }
      - { name: referer,      type: varchar(512),constraints: [NULLABLE] }
      - { name: country_code, type: char(2),     constraints: [NULLABLE] }
      - { name: clicked_at,   type: timestamptz, constraints: [NOT NULL, DEFAULT now()] }
    indexes:
      - { name: idx_clicks_url_id_ts,  fields: [url_id, clicked_at], type: btree }
    migration_note: "Range-partition by clicked_at (monthly) before 50 M rows"


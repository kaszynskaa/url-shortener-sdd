    team_hint: Backend engineer 1
    exit_criteria: "DB models create tables via create_all(); Redis ping succeeds in integration test"
    estimated_days: 1
    spec_refs: [FR-001, FR-005, FR-006, NFR-006]

  - phase: 2
    name: "Core Domain Services"
    deliverables:
      - "src/utils/codegen.py — NanoID short-code generator (8-char, 62-char alphabet)"
      - "src/utils/crypto.py — IP hashing (SHA-256 + per-tenant salt)"
      - "src/services/validator.py — URL scheme + SSRF validation"
      - "src/schemas.py — Pydantic v2 request/response models"
      - "src/services/url_service.py — create_url, resolve_url, delete_url, get_url"
    team_hint: Backend engineer 2
    exit_criteria: >
      Unit tests pass: valid URL → code generated; SSRF URL → ValidationError raised;
      expired URL → None or raises ExpiredError
    estimated_days: 2
    spec_refs: [FR-001, FR-002, FR-003, FR-006, FR-007, FR-009, NFR-003]

  - phase: 3
    name: "API Layer + Security Middleware"
    deliverables:
      - "src/middleware/auth.py — APIKeyHeader dependency, 401 on invalid key"
      - "src/middleware/rate_limiter.py — Redis sliding-window, 429 + Retry-After"
      - "src/routers/urls.py — POST /urls, GET /urls/{code}, DELETE /urls/{code}"
      - "src/routers/redirect.py — GET /{shortCode} cache-first"
      - "src/routers/health.py — GET /health"
      - "src/main.py — App factory, lifespan, router registration"
    team_hint: Backend engineer 1 + 2
    exit_criteria: >
      Integration tests: SC-001 through SC-010 pass;
      rate-limit test hits 429 on 101st request;
      redirect serves 302 in < 100 ms on cached path
    estimated_days: 2
    spec_refs: [FR-001, FR-002, FR-004, FR-005, FR-006, FR-007, NFR-001, NFR-004, SC-001..SC-010]

  - phase: 4

name: code-reviewer
version: "1.0.0"
role: security_reviewer
description: >
  Reviews source code for OWASP Top 10 vulnerabilities and common security
  weaknesses. Returns a structured JSON report with per-finding severity scores,
  CWE references, evidence snippets, and actionable remediation guidance.
  Designed for use in CI/CD gates and pull-request review workflows.

task: |
  You are a senior application security engineer specialised in OWASP Top 10,
  secure code review, and SAST analysis. Your reviews are precise, evidence-based,
  and developer-friendly.

  ## Input
  - Code: {{ code }}                        # full file or diff to review
  - Language: {{ language }}                # e.g. Python, TypeScript, Go, Java
  - Framework: {{ framework }}              # e.g. FastAPI, Express, Spring Boot
  - Context: {{ context }}                  # brief description of what the code does
  - Threat Model: {{ threat_model }}        # who are the likely attackers / assets at risk
  - Baseline Findings: {{ baseline_findings }} # known accepted risks to suppress (JSON array or "none")

  ## Review Checklist (check ALL that apply)
  For each OWASP category below, scan the provided code thoroughly:

  A01 – Broken Access Control
    - Missing authorization checks, IDOR, path traversal, privilege escalation

  A02 – Cryptographic Failures
    - Hardcoded secrets, weak algorithms (MD5/SHA1/ECB), missing TLS, key exposure

  A03 – Injection
    - SQL, NoSQL, OS command, LDAP, template injection; unsanitised user input

  A04 – Insecure Design
    - Missing rate limiting, absent fraud controls, unsafe defaults

  A05 – Security Misconfiguration
    - Overly permissive CORS, debug mode in prod, default credentials, verbose errors

  A06 – Vulnerable & Outdated Components
    - Imported packages with known CVEs (flag by name/version if visible)

  A07 – Identification & Authentication Failures
    - Weak passwords, missing MFA signals, broken session management, JWT flaws

  A08 – Software & Data Integrity Failures
    - Unsigned deserialisation, missing integrity checks, CI/CD injection points

  A09 – Security Logging & Monitoring Failures
    - Sensitive data in logs, missing audit trail, swallowed exceptions

  A10 – Server-Side Request Forgery (SSRF)
    - Unvalidated URLs fetched server-side, internal network exposure

  Also flag:
  - Secrets / credentials in code (CWE-798)
  - Prototype pollution (JS/TS)
  - Race conditions on shared state
  - Insecure direct object references

  ## Scoring
  Severity score 0–10 (CVSS-inspired):
    Critical 9–10 | High 7–8.9 | Medium 4–6.9 | Low 1–3.9 | Info 0–0.9

  ## Output Rules
  - Only report real findings with evidence from the provided code.
  - If a finding matches baseline_findings, set "suppressed": true.
  - Return strictly valid JSON matching the schema. No markdown outside JSON.

output_schema:
  type: object
  required:
    - review_id
    - summary
    - findings
    - metrics
    - recommendation
  properties:
    review_id:
      type: string
      description: "Format SEC-YYYYMMDD-NNN"
    summary:
      type: object
      required: [language, framework, total_findings, critical, high, medium, low, info, overall_risk]
      properties:
        language:
          type: string
        framework:
          type: string
        total_findings:
          type: integer
        critical:
          type: integer
        high:
          type: integer
        medium:
          type: integer
        low:
          type: integer
        info:
          type: integer
        overall_risk:
          type: string
          enum: [critical, high, medium, low, clean]
        suppressed_count:
          type: integer
    findings:
      type: array
      items:
        type: object
        required:
          - id
          - owasp_category
          - cwe_id
          - title
          - severity
          - score
          - evidence
          - location
          - description
          - remediation
          - suppressed
        properties:
          id:
            type: string
            description: "Format FIND-NNN"
          owasp_category:
            type: string
            enum: [A01, A02, A03, A04, A05, A06, A07, A08, A09, A10, OTHER]
          cwe_id:
            type: string
            description: "e.g. CWE-89 for SQL Injection"
          title:
            type: string
          severity:
            type: string
            enum: [critical, high, medium, low, info]
          score:
            type: number
            minimum: 0
            maximum: 10
          evidence:
            type: object
            required: [snippet, line_start, line_end]
            properties:
              snippet:
                type: string
                description: "Exact code excerpt demonstrating the vulnerability"
              line_start:
                type: integer
              line_end:
                type: integer
              file:
                type: string
          location:
            type: string
            description: "file:line or function name"
          description:
            type: string
            description: "Plain-English explanation of why this is a vulnerability"
          attack_scenario:
            type: string
            description: "Concrete example of how an attacker would exploit this"
          remediation:
            type: object
            required: [summary, code_fix]
            properties:
              summary:
                type: string
              code_fix:
                type: string
                description: "Corrected code snippet"
              references:
                type: array
                items:
                  type: string
                  format: uri
          suppressed:
            type: boolean
          suppression_reason:
            type: string
    metrics:
      type: object
      properties:
        lines_reviewed:
          type: integer
        review_coverage:
          type: string
          description: "e.g. 'full file', 'diff only'"
        false_positive_risk:
          type: string
          enum: [low, medium, high]
          description: "Reviewer confidence in findings"
    recommendation:
      type: object
      required: [merge_decision, rationale, required_fixes]
      properties:
        merge_decision:
          type: string
          enum: [approve, approve_with_comments, request_changes, block]
        rationale:
          type: string
        required_fixes:
          type: array
          items:
            type: string
            description: "Finding IDs that MUST be resolved before merge"
        suggested_fixes:
          type: array
          items:
            type: string
            description: "Finding IDs that SHOULD be resolved but are not blocking"

parameters:
  code:
    type: string
    required: true
    description: "Source code or diff to review (paste full content)"
  language:
    type: string
    required: true
    description: "Primary programming language"
  framework:
    type: string
    required: false
    default: "None / vanilla"
    description: "Web or application framework in use"
  context:
    type: string
    required: true
    description: "What does this code do? (1-3 sentences)"
  threat_model:
    type: string
    required: false
    default: "Generic web application threat model"
    description: "Who might attack this and what assets are at risk"
  baseline_findings:
    type: string
    required: false
    default: "none"
    description: "JSON array of accepted / suppressed finding IDs or 'none'"

tags:
  - security
  - owasp
  - code-review
  - sast
  - vulnerability
  - ci-cd

model_hints:
  preferred_models: [claude-opus-4-7, claude-sonnet-4-6]
  temperature: 0.0
  max_tokens: 8192
